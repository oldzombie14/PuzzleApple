async function save(){clearTimeout(timer);if(writing){await writing;if(dirty)return save();return;}if(!dirty)return;if(!ready)throw Error('记录尚未载入');const rev=revision,payload=clone(state);writing=request('/api/record','PUT',payload);try{await writing;if(revision===rev){dirty=false;localStorage.removeItem(key);msg('已自动保存 · '+new Date().toLocaleTimeString());}}catch(e){msg('未保存：'+e.message);throw e;}finally{writing=null;}if(dirty)return save();}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function field(parent,obj,key,label,type='text',options=null,onchange=null){const l=node('label',label),el=node(type==='area'?'textarea':options?'select':'input');if(options)for(const v of options){let o=node('option',v);o.value=v;el.append(o);}else if(type!=='area'){el.type=type;if(type==='number'){el.step='any';el.required=true;}}el.value=obj[key];el.dataset.field=key;el.setAttribute('aria-label',label);el.addEventListener(options?'change':'input',()=>{if(type==='number'&&!el.validity.valid)return;obj[key]=type==='number'?Number(el.value):el.value;changed();if(onchange)onchange();});l.append(el);parent.append(l);return el;}
function toggle(parent,obj,key,label,onchange){const l=node('label'),el=node('input');el.type='checkbox';el.checked=obj[key];el.dataset.field=key;el.addEventListener('change',()=>{obj[key]=el.checked;changed();onchange?.();});l.append(el,document.createTextNode(' '+label));parent.append(l);}
function legacyIntent(c){
 return {targetDescription:({'最近灯':'灯','灯群':'灯'})[c.target]||c.target||'',selectionNotes:c.target==='最近灯'?'多个对象时，选择玩家附近最近的一个。':c.target==='灯群'?'选取玩家附近的一组对象。':'',framing:c.aim==='按灯群高度切换'?'自定义':c.target==='天空'||c.aim==='只调整俯仰'?'只调整俯仰':c.target==='灯群'?'对准目标群':'对准目标',turn:c.snap?'偏转较大时瞬切':'平滑转向',follow:!!c.follow,framingNotes:c.aim==='按灯群高度切换'?'原记录：目标群较低时只抬头；较高时对准目标群，放在画面下方并跟随。具体分界见只读参数。':c.target==='天空'?'原记录：保持左右朝向，抬头至可见天空；原本仰角更高时保持。':''};
}
function parameterDetails(parent,c,title,time){
 const d=node('details');d.dataset.kind='camera-parameters';d.append(node('summary',title));parent.append(d);
 if(time)d.append(node('p','读取时间：'+new Date(time).toLocaleString(),'muted'));
 if(!c){d.append(node('p','此句没有已绑定的镜头资源。','muted'));return;}
 const list=node('dl',undefined,'parameters');d.append(list);
 const pair=(label,value)=>{list.append(node('dt',label),node('dd',String(value)));};
 pair('资源观察对象',c.target);pair('资源取景逻辑',c.aim);
 if(c.rollLocked)pair('Roll','固定为 0°');
 if(c.heightBasedPitchSpeed){pair('低处转向速度',c.lowPitchSpeed+'°／秒');pair('高处转向速度',c.highPitchSpeed+'°／秒');}
 if(c.target==='天空')pair('最低仰角',c.minimumElevation+'°');
 else {pair('目标世界偏移 X／Y／Z',`${c.offsetX}／${c.offsetY}／${c.offsetZ} 米`);pair('俯仰偏移 X（负数抬头）',c.pitch+'°');pair('左右偏移 Y',c.yaw+'°');pair('目标画面高度（0 底部，0.5 中央）',c.viewportY);if(c.target==='灯群')pair('灯群选取半径',c.groupRadius+' 米');if(c.aim==='按灯群高度切换')pair('灯群高度分界',c.heightThreshold+' 米');}
 pair('进入时长',c.enterSeconds+' 秒');pair('保持时长',c.holdSeconds+' 秒');pair('结束时长',c.exitSeconds+' 秒');pair('每侧黑边高度',Number((c.letterbox*100).toFixed(2))+'%');
 pair('资源跟随开关',c.follow?'开启':'关闭');if(c.follow){pair('跟随最高转速',c.followSpeed+'°／秒');pair('跟随响应系数',c.followResponse);}
 pair('瞬切',c.snap?'偏转超过 '+c.snapAngle+'° 时触发':'关闭');pair('转向角度上限','不限');
}
function camera(cell,row,readonly=false,view='current'){
 cell.replaceChildren();if(row.feedback!=='涟漪带星'){cell.append(node('p',row.feedback==='待选择'?'先选择句子反馈；未确认演出。':'不适用 · 无演出','empty'));return;}
 const rowId=row.ruleRowId||row.id,l=node('label'),select=node('select');select.setAttribute('aria-label','是否有演出');for(const t of ['无演出','有演出'])select.append(node('option',t));select.value=row.camera?'有演出':'无演出';select.onchange=()=>{row.camera=select.value==='有演出'?clone(liveCameras?.profiles[rowId]||seed.cameraTemplates[rowId]||seed.cameraTemplates.S03):null;changed();camera(cell,row,readonly,view);};l.append(document.createTextNode('是否有演出'),select);cell.append(l);if(!row.camera)return;
 const intent=row.cameraIntent||legacyIntent(row.camera);
 const keep=()=>{row.cameraIntent=intent;changed();updateHints();};
 field(cell,intent,'targetDescription','观察对象','area',null,keep);
 field(cell,intent,'selectionNotes','选择规则','area',null,keep);
 field(cell,intent,'framing','取景方式','text',['对准目标','对准目标群','只调整俯仰','保持当前朝向','自定义'],keep);
 field(cell,intent,'turn','转向方式','text',['平滑转向','偏转较大时瞬切','直接瞬切','自定义'],keep);
 toggle(cell,intent,'follow','演出期间跟随目标',keep);
 field(cell,intent,'framingNotes','取景说明','area',null,keep);
 const hints=node('div',undefined,'intent-hints');cell.append(hints);
 function updateHints(){hints.replaceChildren();let notes=[];
 if(intent.framing==='保持当前朝向'&&intent.follow)notes.push('待核对：保持朝向与跟随目标。');
 if(intent.framing==='只调整俯仰'&&intent.follow)notes.push('待核对：跟随时允许的转向范围。');
 if(intent.framing==='保持当前朝向'&&intent.turn!=='平滑转向')notes.push('待核对：保持朝向与转向设置。');
 for(const note of notes)hints.append(node('p',note,'muted'));
 }updateHints();
 const submitted=view!=='current'||state.round.status==='submitted';
 const ref=submitted?state.history.find(h=>String(h.number)===String(view==='current'?state.round.number:view))?.cameraParameters:liveCameras;
 if(ref)parameterDetails(cell,ref.profiles[rowId],submitted?'当时参数（只读）':'当前参数（只读）',ref.capturedAt);
 else cell.append(node('p',submitted?'此历史轮次未记录实际资源参数。':'当前资源参数未读取成功，请刷新后重试。','muted'));
 if(!row.cameraIntent)parameterDetails(cell,row.camera,'旧版记录');
}
function casesFor(row){return row.cases||[{id:'original',condition:'',conditionMode:'通用',feedback:row.feedback,worldChange:row.worldChange,specialRules:row.specialRules,camera:clone(row.camera),...(row.cameraIntent?{cameraIntent:clone(row.cameraIntent)}:{})}];}
function renderCases(effectCell,cameraCell,row,readonly,view){
 const cases=casesFor(row),selectionKey=view+':'+row.id;
 let index=Math.min(caseSelection.get(selectionKey)||0,cases.length-1),entry=cases[index];
 function edit(){if(!row.cases)row.cases=cases;changed();}
 const picker=node('select');picker.setAttribute('aria-label','表现情况');picker.dataset.field='caseSelection';
 function refreshLabels(){picker.replaceChildren();cases.forEach((c,i)=>{const o=node('option',`${i+1}. ${c.conditionMode==='自定义条件'&&c.condition.trim()?c.condition.trim():'通用'}`);o.value=String(i);picker.append(o);});picker.value=String(index);}
 refreshLabels();picker.onchange=()=>{caseSelection.set(selectionKey,Number(picker.value));render();};const navigator=node('div');navigator.append(node('label','表现情况'),picker);effectCell.parentElement.insertBefore(navigator,effectCell);
 const add=node('button','＋ 添加情况');add.type='button';add.dataset.action='add-case';add.onclick=()=>{cases.push({id:crypto.randomUUID(),condition:'',conditionMode:'通用',feedback:'待选择',worldChange:'',specialRules:'',camera:null});row.cases=cases;caseSelection.set(selectionKey,cases.length-1);changed();render();};effectCell.append(add);
 const form=node('div');effectCell.append(form);
 // Preserve the original single-case fields as a legacy snapshot; new edits live in cases.
 const mode=field(form,entry,'conditionMode','适用条件','text',['通用','自定义条件'],()=>{edit();render();});
 if(entry.conditionMode==='自定义条件')field(form,entry,'condition','条件','area',null,()=>{edit();refreshLabels();}).placeholder='留空为通用';
 field(form,entry,'feedback','句子反馈','text',['待选择','划掉','涟漪带星','涟漪'],()=>{entry.camera=entry.feedback==='涟漪带星'?clone(seed.cameraTemplates[row.id]||null):null;edit();renderCaseCamera();});
 toggle(form,entry,'conflictDim','冲突时变淡',()=>{entry.conflictReason??='';edit();render();});
 if(entry.conflictDim)field(form,entry,'conflictReason','冲突原因','area',null,edit);
 field(form,entry,'worldChange','世界变化','area',null,edit);field(form,entry,'specialRules','特殊规则','area',null,edit);
 function renderCaseCamera(){cameraCell.replaceChildren();cameraCell.append(node('p',`对应情况 ${index+1}`,'muted'));const box=node('div');cameraCell.append(box);Object.defineProperty(entry,'ruleRowId',{value:row.id,configurable:true,enumerable:false});camera(box,entry,readonly,view);}
 renderCaseCamera();
 form.addEventListener('input',()=>{if(!row.cases)row.cases=cases;});
 cameraCell.addEventListener('input',()=>{if(!row.cases)row.cases=cases;},true);cameraCell.addEventListener('change',()=>{if(!row.cases)row.cases=cases;},true);
 if(cases.length>1){const remove=node('button','删除当前情况');remove.type='button';remove.dataset.action='remove-case';remove.onclick=()=>{if(!confirm('删除当前情况？已提交的历史不会改变。'))return;cases.splice(index,1);row.cases=cases;caseSelection.set(selectionKey,Math.max(0,index-1));changed();render();};effectCell.append(remove);}
}
function render(){const chosen=$('#view').value||'current',snapshot=chosen==='current'?state:state.history.find(h=>String(h.number)===chosen),readonly=chosen!=='current'||state.round.status==='submitted';$('#roundTitle').textContent=chosen==='current'?`· 第 ${state.round.number} 轮${readonly?'（已提交）':'（草稿）'}`:`· 第 ${snapshot.number} 轮历史（只读）`;
 $('#save').disabled=readonly||busy;$('#submit').disabled=readonly||busy;$('#next').disabled=chosen!=='current'||state.round.status!=='submitted'||busy;$('#rows').replaceChildren();let shown=0;
 for(const row of snapshot.rows){const past=state.history.filter(h=>h.number<(chosen==='current'?state.round.number:snapshot.number)),previous=past.at(-1)?.rows.find(r=>r.id===row.id);if($('#filter').value==='changes'&&previous?.status!=='需修改'||$('#filter').value==='current'&&row.status!=='需修改')continue;shown++;
 const tr=node('tr');tr.dataset.id=row.id;const cells=Array.from({length:4},()=>{const td=node('td');tr.append(td);const fs=node('fieldset');fs.disabled=readonly||busy;td.append(fs);return fs;});$('#rows').append(tr);
 cells[0].append(node('div',row.id,'muted'));
 const symbols=node('div',undefined,'sentence-symbols');symbols.setAttribute('role','group');symbols.setAttribute('aria-label',row.id+' 符号句子');
 const tokens=row.sentence.split(/[（(]/)[0].trim().toLowerCase().split(/\s+/);
 for(const [i,token] of tokens.entries()){const img=node('img');img.src=symbolImages[token]||'';img.alt='第 '+(i+1)+' 个符号';symbols.append(img);}cells[0].append(symbols);
 renderCases(cells[1],cells[2],row,readonly||busy,chosen);
 field(cells[3],row,'status','本轮状态','text',['待测','通过','暂不复测','需修改','未复现']);field(cells[3],row,'notes','修改意见','area');if(row.hint){const reference=node('details');reference.append(node('summary','检查参考'),node('p',row.hint,'muted'));cells[3].append(reference);}
 if(previous?.status==='需修改'){cells[3].append(node('div','上一轮要求修改','badge'),node('div',previous.notes||'未填写具体意见','note'));}
 const histories=past.filter(h=>h.rows.some(r=>r.id===row.id));if(histories.length){const d=node('details');d.append(node('summary',`历史记录（${histories.length} 轮）`));for(const h of histories.slice().reverse()){const r=h.rows.find(r=>r.id===row.id),e=node('div',undefined,'history-entry');e.append(node('strong',`第 ${h.number} 轮 · ${r.status}`),node('div',new Date(h.submittedAt).toLocaleString(),'muted'),node('div',r.notes||'无备注','note'));d.append(e);}tr.lastChild.append(d);}}
 if(!shown){const tr=node('tr'),td=node('td','没有符合条件的条目。');td.colSpan=4;tr.append(td);$('#rows').append(tr);}}
function views(){const v=$('#view');v.replaceChildren();const c=node('option',`当前 · 第 ${state.round.number} 轮`);c.value='current';v.append(c);for(const h of state.history.slice().reverse()){const o=node('option',`历史 · 第 ${h.number} 轮`);o.value=String(h.number);v.append(o);}render();}
async function transition(action){busy=true;render();try{await save();state=await request('/api/'+action,'POST',{});dirty=false;localStorage.removeItem(key);views();msg(action==='submit'?'本轮已提交并保存为历史。':'已开始新一轮；上一轮意见已保留。');}catch(e){msg(e.message);}finally{busy=false;render();}}
$('#save').onclick=()=>save().catch(()=>{});$('#submit').onclick=()=>transition('submit');$('#next').onclick=()=>transition('next');$('#view').onchange=render;$('#filter').onchange=render;$('#export').onclick=()=>{const a=node('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='2026-10-24-01-备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
async function init(){if(location.protocol==='file:'){location.replace('http://127.0.0.1:18764/');return;}try{const r=await fetch('/api/record');if(!r.ok)throw Error('无法读取记录');state=await r.json();if(state.version!==2)throw Error('请重启本地工具加载新版');etag=r.headers.get('ETag');ready=true;try{const cr=await fetch('/api/cameras');if(cr.ok)liveCameras=await cr.json();}catch{}const draft=JSON.parse(localStorage.getItem(key)||'null');if(draft&&draft.etag===etag&&draft.state.round.status==='draft'){state=draft.state;dirty=true;}views();msg('已载入 · 自动保存');if(dirty)await save();}catch(e){msg(e.message);}}
init();
